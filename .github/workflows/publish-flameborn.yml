name: Publish Flameborn Package

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-flameborn.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ashalon-flameborn
          fetch-depth: 0
      - name: Rebuild and verify install ZIP
        shell: bash
        run: |
          cat ashalon-flameborn/.build/fixed01.b64 \
              ashalon-flameborn/.build/fixed02.b64 \
              ashalon-flameborn/.build/fixed03.b64 \
              ashalon-flameborn/.build/fixed04.b64 \
            | base64 --decode > ashalon-flameborn/ashalon-flameborn-v1.0.0.zip
          test "$(stat -c%s ashalon-flameborn/ashalon-flameborn-v1.0.0.zip)" = "44306"
          echo "d70d6ea310e9aad3a5faaa61be13cb8bfbf8e171d1bd714ece9c1aff9250abf1  ashalon-flameborn/ashalon-flameborn-v1.0.0.zip" | sha256sum -c -
          unzip -t ashalon-flameborn/ashalon-flameborn-v1.0.0.zip
      - name: Commit package to module branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ashalon-flameborn/ashalon-flameborn-v1.0.0.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish Flameborn v1.0.0 install ZIP"
            git push origin HEAD:ashalon-flameborn
          fi
